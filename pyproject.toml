[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis"
version = "1.0.0"
description = "Genesis — GTL-first AI SDLC engine"
requires-python = ">=3.11"
dependencies = [
    # GTL is the constitutional language — evolved in ai_sdlc_method, consumed here.
    # The CC to our GCC: ai_sdlc_method evolves GTL; abiogenesis builds on it.
    # Future: publish genesis-gtl to PyPI and pin by version.
    "genesis-gtl @ file:///Users/jim/src/apps/ai_sdlc_method/imp_codex/code",
]

[project.scripts]
gen = "genesis.__main__:main"

[tool.pytest.ini_options]
testpaths = ["builds/claude_code/tests"]
pythonpath = ["builds/claude_code/code", ".genesis", "."]
markers = [
    "e2e: end-to-end sandbox tests",
    "self_host: self-hosting bootstrap tests",
]

[tool.setuptools.packages.find]
where = ["builds/claude_code/code"]
