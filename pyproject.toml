[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis"
version = "0.3.0"
description = "Genesis — GTL-first AI SDLC engine"
requires-python = ">=3.11"
dependencies = []
# GTL is vendored at abiogenesis/gtl/ (v0.3.0, copied from ai_sdlc_method/imp_codex/code/gtl/).
# Resolved via pythonpath = ["."] in tool.pytest.ini_options and via PYTHONPATH in runtime.
# To upgrade: copy gtl/ from ai_sdlc_method again and commit.

[project.scripts]
gen = "genesis.__main__:main"

[tool.pytest.ini_options]
testpaths = ["builds/claude_code/tests"]
pythonpath = ["builds/claude_code/code", ".genesis", "."]
markers = [
    "e2e: end-to-end sandbox tests (may invoke Claude API)",
    "self_host: workspace_bootstrap required; tests the bootstrapped directory structure",
    "bootstrap_state: lightweight tests using EventStream + Python objects; no workspace_bootstrap",
    "phase_c: target-state assertions; require real convergence events in events.jsonl",
]

[tool.setuptools]
packages = ["genesis", "gtl"]

[tool.setuptools.package-dir]
"genesis" = "builds/claude_code/code/genesis"
"gtl" = "gtl"
