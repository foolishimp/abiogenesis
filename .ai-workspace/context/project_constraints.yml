project:
  name: abiogenesis
  version: "1.0.0"
  phase: 4
  doctrine: docs/V1_DOCTRINE.md
  spec: gtl_spec/packages/abiogenesis.py
  package: abiogenesis

bootstrap:
  compiler: genesis_sdlc
  source: /Users/jim/src/apps/genesis_sdlc

builds:
  - id: claude_code
    path: builds/claude_code
    status: complete
    worker: claude_code

workspace:
  event_log: .ai-workspace/events/events.jsonl
  features: .ai-workspace/features/
  context: .ai-workspace/context/
  reviews: .ai-workspace/reviews/
  comments: .ai-workspace/comments/

constraints:
  language: python
  python_version: ">=3.11"
  test_runner: pytest
  engine_modules: 6
  commands: [gen-start, gen-iterate, gen-gaps]
  single_tenant: true
  v2_features_allowed: false
