id: REQ-F-PROV-001
title: Workflow Provenance — Version Binding for Approvals and Assessments
status: proposed
satisfies:
  - REQ-F-PROV-001
  - REQ-F-PROV-002
  - REQ-F-PROV-003
  - REQ-F-PROV-004
  - REQ-F-PROV-005

codex_review_round: 3
codex_findings_addressed:
  - "Finding 1: hash now includes description; covers F_P/F_H where command is empty"
  - "Finding 2: hash function operates on Job.evaluators not Edge; Edge has no evaluators field"
  - "Finding 3: spec_hash change gated on workflow_version; backward compat preserved end-to-end"
  - "Finding 4: schedule.py lines 70-77 updated alongside bind.py"
  - "Finding 5: emit-event runs pre-stack without Scope; reads active-workflow.json directly using same parse logic as REQ-F-PROV-001 (not scope.workflow_version)"

description: |
  Engine changes to bind convergence events (fp_assessment, review_approved)
  to the workflow version that was active when they were emitted. Without this
  binding, a workflow upgrade that tightens evaluator criteria can silently
  reuse stale convergence evidence.

  These are core engine changes. Backward compatibility is preserved end-to-end:
  all new provenance behaviour activates only when active-workflow.json is present.
  Workspaces without this file behave identically to the current engine.

  ─────────────────────────────────────────────────────────────
  REQ-F-PROV-001  Engine reads active-workflow.json at startup
  ─────────────────────────────────────────────────────────────
  The engine reads .genesis/active-workflow.json once at startup, before any
  command executes. The loaded value is stored on Scope:

    scope.workflow_version: str

  Construction from the JSON file:
    {"workflow": "genesis_sdlc.standard", "version": "0.2.0"}
    → scope.workflow_version = "genesis_sdlc.standard@0.2.0"

  Format: "{workflow}@{version}" where workflow and version are the string
  values of those keys. No other transformation.

  Fallback (all cases yield "unknown"):
    - File absent
    - File present but not valid JSON
    - File valid JSON but missing "workflow" or "version" key
    - Either value is not a string

  The engine never fails to start due to active-workflow.json state.

  ─────────────────────────────────────────────────────────────
  REQ-F-PROV-002  workflow_version annotated on emitted events
  ─────────────────────────────────────────────────────────────
  emit-event is a pre-stack CLI command: it runs without a Scope object and
  before the engine stack is built. It cannot use scope.workflow_version.

  Instead, emit-event reads .genesis/active-workflow.json directly from the
  workspace at call time, using the same parse logic defined in REQ-F-PROV-001:

    workflow_version = _read_workflow_version(workspace)
    data["workflow_version"] = workflow_version

  _read_workflow_version(workspace) is a pure function (no Scope dependency):
    - Opens workspace / ".genesis" / "active-workflow.json"
    - Parses JSON; extracts "workflow" and "version" string keys
    - Returns "{workflow}@{version}"
    - Returns "unknown" on any failure (absent, invalid JSON, missing keys,
      non-string values) — same fallback rules as REQ-F-PROV-001

  This function is the single implementation shared by both:
    (a) Scope.__init__ at engine startup (REQ-F-PROV-001)
    (b) emit-event at CLI call time (this requirement)

  Annotation is unconditional — applies to all event types. It is applied
  after existing required-field validation so it cannot cause existing
  validation to fail.

  Callers (the gen-start skill) do not pass workflow_version. The write path
  is the sole source.

  ─────────────────────────────────────────────────────────────
  REQ-F-PROV-003  job_evaluator_hash replaces req_hash for F_P spec binding
  ─────────────────────────────────────────────────────────────
  New function in bind.py:

    def job_evaluator_hash(job: Job) -> str:
        """
        Hash of all evaluator definitions on this job.
        Covers F_D (command), F_P/F_H (description), and name+category for all.
        Changing any evaluator field on the job changes this hash.
        """
        import re
        lines = sorted(
            f"{ev.name}:{ev.category.__name__}:{ev.command}:{ev.description}"
            for ev in job.evaluators
        )
        raw = "\n".join(
            re.sub(r'\s+', ' ', line.strip()) for line in lines
        )
        return hashlib.sha256(raw.encode()).hexdigest()[:16]

  Key design decisions:
  - Hashes Job.evaluators (not Edge — Edge has no evaluators field; core.py#L169)
  - Includes description: normative contract for F_P/F_H where command is empty
  - Includes command: normative contract for F_D
  - category.__name__ produces "F_D", "F_P", or "F_H" (category is a type object)
  - Sorted input: evaluator order does not affect the hash
  - Whitespace normalised per line before hashing

  req_hash() is NOT deleted. It is kept, marked deprecated in its docstring,
  and used as the fallback when workflow_version == "unknown" (see below).

  Spec_hash computation in commands.py is gated on scope.workflow_version:

    if scope.workflow_version == "unknown":
        spec_hash = req_hash(scope.package.requirements)   # old behaviour
    else:
        spec_hash = job_evaluator_hash(job)                # new behaviour

  This gate is applied at all three call sites:
    commands.py line 93  (gen_gaps)
    commands.py line 155 (gen_iterate)
    commands.py line 339 (_derive_state)

  Consequence: workspaces without active-workflow.json use req_hash throughout
  and behave identically to the current engine. Provenance-aware spec_hash
  activates only when active-workflow.json is present.

  ─────────────────────────────────────────────────────────────
  REQ-F-PROV-004  Version-aware F_H approval binding — two paths
  ─────────────────────────────────────────────────────────────
  Two independent code paths currently resolve review_approved events.
  Both must be updated consistently.

  PATH 1 — bind.py bind_fh() (lines 140-144)

  Updated signature:
    def bind_fh(job, all_events, current_workflow_version: str = "unknown",
                carry_forward: list[dict] | None = None) -> bool

  Default values preserve existing call sites without modification.

  PATH 2 — schedule.py delta() (lines 70-77)

  Currently:
    approved = any(
        e.get("event_type") == "review_approved"
        and e.get("data", {}).get("edge") == job.edge.name
        for e in events
    )

  Updated to call bind_fh directly, passing current_workflow_version and
  carry_forward from the delta() caller context:

    approved = bind_fh(job, events,
                       current_workflow_version=current_workflow_version,
                       carry_forward=carry_forward)

  schedule.delta() signature updated:
    def delta(job, events, current_workflow_version: str = "unknown",
              carry_forward: list[dict] | None = None) -> DeltaResult

  Default values preserve existing callers without modification.

  APPROVAL LOGIC (implemented once in bind_fh; schedule delegates to it):

  When current_workflow_version == "unknown":
    Accept any review_approved event matching edge name alone.
    (Full backward compatibility — identical to current behaviour.)

  When current_workflow_version != "unknown":

    For each review_approved event matching edge name:

    Condition A — version match:
      event.data.get("workflow_version") == current_workflow_version
      → accepted

    Condition B — carry-forward:
      edge name in carry_forward list
      AND event.data.get("workflow_version") == entry["from_version"]
      → accepted

    Otherwise:
      → not accepted (edge remains failing)

  Pre-provenance events (no workflow_version field):
    event.data.get("workflow_version") returns None.
    Condition A: None != current_workflow_version → False.
    Condition B: None != from_version → False.
    Result: pre-provenance approvals do NOT satisfy the gate when the engine
    has a known workflow_version.

  carry_forward schema (list of dicts passed by caller):
    [{"edge": "intent→requirements", "from_version": "genesis_sdlc.standard@0.1.0"}]

  Sourced from variant manifest.json at:
    .genesis/workflows/{workflow}/{variant}/{version}/manifest.json
  parsed by the commands layer and passed into bind_fh / delta().
  If manifest.json absent or has no approved_carry_forward key: carry_forward = [].

  ─────────────────────────────────────────────────────────────
  REQ-F-PROV-005  Orphan tolerance — explicit guarantee
  ─────────────────────────────────────────────────────────────
  No code change. The engine already ignores events for edge names absent from
  the current graph (orphaned events never enter bind_fh or bind_fp because
  the engine only iterates over jobs in scope.jobs). A comment is added in
  gen_gaps and gen_iterate to make this guarantee explicit:

    # Orphan tolerance: events referencing edges not in scope.jobs are
    # silently ignored. This is the mechanism that allows graph evolution
    # without event stream migration.

acceptance_criteria:
  # REQ-F-PROV-001 — startup read
  - scope.workflow_version == "genesis_sdlc.standard@0.2.0" when file contains
    {"workflow": "genesis_sdlc.standard", "version": "0.2.0"}
  - scope.workflow_version == "unknown" when file is absent
  - scope.workflow_version == "unknown" when file contains invalid JSON
  - scope.workflow_version == "unknown" when "workflow" key is missing
  - scope.workflow_version == "unknown" when "version" key is missing
  - engine starts without error in all five cases above

  # REQ-F-PROV-002 — annotation on emit
  - event emitted via emit-event contains workflow_version in data dict
  - value equals _read_workflow_version(workspace) at time of emission
  - annotation is present on review_approved events
  - annotation is present on fp_assessment events
  - annotation is present on edge_converged events (all event types)
  - existing required-field validation still passes (annotation added after)
  # _read_workflow_version isolation (shared function)
  - _read_workflow_version returns "genesis_sdlc.standard@0.2.0" when file present and valid
  - _read_workflow_version returns "unknown" when file absent
  - _read_workflow_version returns "unknown" when file contains invalid JSON
  - _read_workflow_version returns "unknown" when "workflow" key missing
  - _read_workflow_version returns "unknown" when "version" key missing
  - _read_workflow_version has no Scope dependency (callable pre-stack)

  # REQ-F-PROV-003 — job_evaluator_hash
  - job_evaluator_hash(job) returns a 16-char lowercase hex string
  - two jobs with identical evaluator sets return the same hash
  - adding an evaluator to a job changes the hash
  - changing any evaluator command changes the hash
  - changing any evaluator description changes the hash (F_P/F_H semantic change)
  - changing evaluator name changes the hash
  - evaluator order does not affect the hash (sorted)
  - whitespace normalised: "pytest  -v" and "pytest -v" produce the same hash
  - category serialised as class name string: F_D, F_P, F_H
  - req_hash() still exists and is importable (not deleted)
  # spec_hash gate
  - when scope.workflow_version == "unknown": spec_hash = req_hash(requirements)
  - when scope.workflow_version != "unknown": spec_hash = job_evaluator_hash(job)
  - fp_assessment with stale spec_hash (evaluator changed, workflow_version known):
    does not satisfy F_P convergence
  - fp_assessment with matching job_evaluator_hash: satisfies F_P convergence
  - fp_assessment with req_hash (old format) on workspace with workflow_version "unknown":
    satisfies F_P convergence (backward compat)

  # REQ-F-PROV-004 — bind_fh + schedule.delta version check
  # bind_fh path
  - review_approved matching workflow_version: F_H gate satisfied
  - review_approved non-matching workflow_version, no carry_forward: NOT satisfied
  - review_approved non-matching but edge in carry_forward with correct from_version: satisfied
  - review_approved non-matching, carry_forward present but from_version wrong: NOT satisfied
  - review_approved no workflow_version field (pre-provenance), current version known: NOT satisfied
  - when current_workflow_version == "unknown": all review_approved accepted by edge name alone
  - bind_fh(job, events) with no extra args behaves identically to current engine
  # schedule.delta path
  - schedule.delta() F_H check uses bind_fh (no duplicate logic)
  - schedule.delta(job, events) with no extra args behaves identically to current engine
  - schedule.delta() with current_workflow_version and mismatched approval: returns failing
  - schedule.delta() with current_workflow_version and matching approval: returns passing

  # REQ-F-PROV-005 — orphan tolerance comment
  - orphan tolerance comment present in gen_gaps
  - orphan tolerance comment present in gen_iterate
  - engine does not error on events.jsonl containing review_approved for unknown edge

  # Regression — no existing behaviour changes when active-workflow.json absent
  - test_bind.py: all existing tests pass without modification
  - test_commands.py: all existing tests pass without modification
  - test_schedule.py: all existing tests pass without modification
  - workspace without active-workflow.json: gen_gaps output identical to current engine

  # New tests required — test_bind.py additions
  # TestJobEvaluatorHash (new class)
  - test_returns_16_char_hex
  - test_identical_evaluator_sets_same_hash
  - test_added_evaluator_changes_hash
  - test_changed_command_changes_hash
  - test_changed_description_changes_hash
  - test_order_independent
  - test_whitespace_normalised
  - test_category_serialised_as_class_name
  # TestBindFhVersioned (new class)
  - test_matching_workflow_version_passes
  - test_mismatched_workflow_version_fails
  - test_carry_forward_correct_from_version_passes
  - test_carry_forward_wrong_from_version_fails
  - test_pre_provenance_event_fails_when_version_known
  - test_unknown_current_version_accepts_by_edge_name
  - test_no_extra_args_identical_to_current_behaviour
  # TestSpecHashGate (new class)
  - test_unknown_workflow_uses_req_hash
  - test_known_workflow_uses_job_evaluator_hash
  - test_stale_fp_assessment_not_accepted_when_version_known
  - test_req_hash_format_fp_assessment_accepted_when_version_unknown

  # New tests required — test_commands.py additions
  # TestReadWorkflowVersion (new class — unit tests for shared pure function)
  - test_returns_formatted_string_when_valid
  - test_returns_unknown_when_file_absent
  - test_returns_unknown_when_invalid_json
  - test_returns_unknown_when_workflow_key_missing
  - test_returns_unknown_when_version_key_missing
  - test_no_scope_dependency (callable with only workspace path)
  # TestWorkflowVersionScope (new class — Scope.__init__ uses shared function)
  - test_scope_loads_workflow_version_from_file
  - test_scope_unknown_when_file_absent
  - test_scope_unknown_when_file_malformed
  - test_scope_unknown_when_key_missing
  # TestWorkflowVersionAnnotation (new class — emit-event reads file directly, no Scope)
  - test_emit_event_annotates_workflow_version_from_file
  - test_emit_annotates_unknown_when_no_active_workflow
  - test_emit_does_not_require_scope_object

  # New tests required — test_schedule.py additions
  # TestScheduleDeltaVersioned (new class)
  - test_fh_passes_matching_version
  - test_fh_fails_mismatched_version
  - test_no_args_identical_to_current_behaviour
  - test_delegates_to_bind_fh_not_duplicate_logic

dependencies:
  - REQ-F-BIND
  - REQ-F-GATE

risk: |
  PRIMARY RISK — spec_hash change on existing workspaces with active-workflow.json

  Once Part A (genesis_sdlc) installs active-workflow.json, scope.workflow_version
  becomes non-"unknown". At that point, spec_hash switches from req_hash to
  job_evaluator_hash for all gen_gaps / gen_iterate runs. Any existing fp_assessment
  events in the stream carry the old req_hash format. They will no longer match.
  All F_P edges reopen.

  This is intentional: stale assessments should not carry through a workflow upgrade.
  The consequence is that after Part A deploys, F_P edges require re-assessment.
  This must be documented in the genesis_sdlc release notes as a known migration step.

  MITIGATION — sequencing
  Part B (this feature) ships first and is inert on all existing workspaces
  (workflow_version = "unknown" everywhere, old behaviour preserved).
  Part A installs active-workflow.json and activates provenance.
  The F_P re-assessment requirement is therefore predictable and bounded:
  it occurs exactly once, at the first gen_gaps run after Part A deploys.

  SECONDARY RISK — schedule.py refactor
  schedule.delta() currently has its own inline review_approved check (lines 70-77).
  This feature changes it to delegate to bind_fh. The refactor must not change
  the semantics of the delta() return value. The TestScheduleDeltaVersioned tests
  verify this. Specifically: test_no_args_identical_to_current_behaviour must pass
  without modification of any existing test.
