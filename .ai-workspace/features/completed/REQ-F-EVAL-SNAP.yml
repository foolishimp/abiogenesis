feature: REQ-F-EVAL-SNAP
description: >
  Spec-snapshot binding for fp_assessment events. bind_fd() and delta() compute a hash
  of Package.requirements at evaluation time and embed it in each fp_assessment event.
  Assessments whose snapshot hash does not match the current Package.requirements hash
  are treated as stale and excluded from convergence computation. Fixes the engine bug
  where spec evolution leaves old pass events structurally valid.
satisfies:
  - REQ-F-EVAL-002
status: completed
