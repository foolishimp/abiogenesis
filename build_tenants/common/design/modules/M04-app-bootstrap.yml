module: M04-app-bootstrap
status: active
owns:
  - app-facing orchestration services
  - CLI boundary
  - installer and workspace bootstrap
  - bootloader carrier and project-facing operations
  - hook-driven auto loop for `start --auto`
  - proxy approval handling for `--human-proxy`
  - optional runtime hook seam for `F_P` dispatch and `F_H` approval
  - runtime identity projection and configured worker resolution from the runtime contract
implements_features:
  - REQ-P-POLICY
  - REQ-P-QUAL
interfaces:
  - genesis start --auto
  - genesis start --auto --human-proxy
  - _run_start_auto(scope, stream, workspace, mod_ref, human_proxy)
  - _resolve_runtime_hook(mod_ref, hook_name)
  - _emit_human_proxy_approval(workspace, edge)
  - _resolve_configured_worker(config, workspace)
  - _resolve_runtime_identity(config, worker)
primary_surfaces:
  - build_tenants/abiogenesis/python/code/genesis/identity.py
  - build_tenants/abiogenesis/python/code/genesis/services.py
  - build_tenants/abiogenesis/python/code/genesis/cli_adapter.py
  - build_tenants/abiogenesis/python/code/gen-install.py
  - build_tenants/abiogenesis/python/code/genesis/install.py
  - build_tenants/abiogenesis/python/code/gtl_spec/GTL_BOOTLOADER.md
invariants:
  - services.gen_start() remains one-step engine progression and does not absorb app-owned orchestration policy
  - CLI orchestration may loop, proxy approvals, and resolve hooks, but it must not redefine GTL or ABG kernel semantics
  - runtime identity and configured worker resolution are explicit inputs, not hidden build defaults
composes_with:
  - M03-engine-kernel provides the one-step engine progression and runtime truth being orchestrated
  - M02-work-publication provides installed module surfaces and optional runtime hooks
  - M05-qualification-scenarios proves the auto/proxy loop against fake and live scenario harnesses
test_obligations:
  - CLI auto-loop regression tests for repeated fp-dispatch and human-proxy approval flow
  - runtime identity projection tests that preserve worker/build/backend/authority truth
  - installer/bootstrap tests that keep orchestration separate from kernel semantics
notes:
  - `services.gen_start()` remains the engine-facing one-step progression surface
  - CLI auto mode is a higher-order orchestration layer above one-step progression
  - Runtime-specific `F_P` and `F_H` handling enters through optional hooks resolved from the installed module surface rather than hardcoded backend branches in the CLI
  - runtime contract worker identity is first-class input; the CLI must not silently replace it with a build default
