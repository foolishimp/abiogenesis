module: M04-app-bootstrap
status: active
owns:
  - app-facing orchestration services
  - operator-facing entry boundary
  - event/assessment ingress over the canonical kernel emission surface
  - installer and workspace bootstrap
  - bootloader carrier and project-facing operations
  - engine-driven auto progression loop
  - proxy approval handling above the kernel
  - runtime identity projection and configured worker resolution from the runtime contract
implements_features:
  - REQ-P-POLICY
  - REQ-P-QUAL
interfaces:
  - public start operator with auto progression
  - public start operator with proxy approval
  - event ingress command surface
  - result assessment ingress surface
  - auto progression loop surface
  - human proxy approval surface
  - configured worker resolution surface
  - runtime identity projection surface
primary_surfaces:
  - app-bootstrap.identity-projection-surface
  - app-bootstrap.operator-entry-surface
  - app-bootstrap.event-ingress-surface
  - app-bootstrap.install-bootstrap-surface
  - app-bootstrap.bootloader-surface
invariants:
  - the engine-facing advancement surface remains one-step progression and does not absorb app-owned orchestration policy
  - app orchestration may loop and proxy approvals, but it must not redefine GTL or ABG kernel semantics
  - event and assessment ingress may validate and annotate payloads, but they shall still route through the canonical ABG emit surface rather than append directly to runtime truth
  - runtime identity and configured worker resolution are explicit inputs, not hidden build defaults
  - when runtime build identity is absent, the app layer preserves the kernel's neutral compatibility projection rather than reintroducing a tenant-specific default
composes_with:
  - M03-engine-kernel provides the one-step engine progression and runtime truth being orchestrated
  - M02-work-publication provides installed module and runtime-config surfaces
  - M05-qualification-scenarios proves the auto/proxy loop against fake and live scenario harnesses
test_obligations:
  - operator auto-loop regression tests for repeated fp-dispatch and proxy approval flow
  - runtime identity projection tests that preserve worker/build/backend/authority truth
  - installer/bootstrap tests that keep orchestration separate from kernel semantics
  - installer completeness tests that prove every declared runtime surface is present in the installed delivery root
  - installed-runtime smoke tests that invoke the tenant's installed public runtime entrypoint rather than only through source-only imports
notes:
  - the engine-facing one-step progression surface remains below app-owned orchestration
  - auto mode is a higher-order orchestration layer above one-step progression
  - event ingress remains app-owned, but event persistence is kernel-owned through the canonical emit surface
  - `F_P` handling is engine-owned through dispatch-runtime policy resolution; `F_H` proxy approval remains an app concern
  - runtime contract worker identity is first-class input; the app layer must not silently replace it with a build default
  - absent explicit runtime build identity, the compatibility `build` projection resolves through engine/worker runtime truth rather than a historical tenant fallback
