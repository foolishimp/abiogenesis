module: M04-app-bootstrap
status: active
owns:
  - app-facing orchestration services
  - CLI boundary
  - CLI event/assessment ingress over the canonical kernel emission surface
  - installer and workspace bootstrap
  - bootloader carrier and project-facing operations
  - engine-driven auto loop for `start --auto`
  - proxy approval handling for `--human-proxy`
  - runtime identity projection and configured worker resolution from the runtime contract
implements_features:
  - REQ-P-POLICY
  - REQ-P-QUAL
interfaces:
  - genesis start --auto
  - genesis start --auto --human-proxy
  - genesis emit-event
  - genesis assess-result
  - _run_start_auto(scope, stream, workspace, config, human_proxy)
  - _emit_workspace_event(workspace, event_type, data, workflow_version, work_key, run_id)
  - _emit_event_cmd(event_type, data_json, workspace)
  - _assess_result_cmd(result_path, workspace)
  - _emit_human_proxy_approval(workspace, edge)
  - _resolve_configured_worker(config, workspace)
  - _resolve_runtime_identity(config, worker)
primary_surfaces:
  - genesis.identity
  - genesis.services
  - genesis.cli_adapter
  - gen-install
  - genesis.install
  - gtl_spec.GTL_BOOTLOADER
invariants:
  - services.gen_start() remains one-step engine progression and does not absorb app-owned orchestration policy
  - CLI orchestration may loop and proxy approvals, but it must not redefine GTL or ABG kernel semantics
  - CLI event and assessment commands may validate and annotate payloads, but they shall still route through the canonical ABG emit surface rather than append directly to the event log
  - runtime identity and configured worker resolution are explicit inputs, not hidden build defaults
  - when runtime build identity is absent, the app layer preserves the kernel's neutral compatibility projection rather than reintroducing a tool-specific default
composes_with:
  - M03-engine-kernel provides the one-step engine progression and runtime truth being orchestrated
  - M02-work-publication provides installed module and runtime-config surfaces
  - M05-qualification-scenarios proves the auto/proxy loop against fake and live scenario harnesses
test_obligations:
  - CLI auto-loop regression tests for repeated fp-dispatch and human-proxy approval flow
  - runtime identity projection tests that preserve worker/build/backend/authority truth
  - installer/bootstrap tests that keep orchestration separate from kernel semantics
  - installer completeness tests that prove every declared genesis runtime module is present in the installed `.genesis/genesis/` surface
  - installed-runtime smoke tests that invoke `python -m genesis` from `PYTHONPATH=<workspace>/.genesis` rather than only through source imports
notes:
  - `services.gen_start()` remains the engine-facing one-step progression surface
  - CLI auto mode is a higher-order orchestration layer above one-step progression
  - CLI event ingress remains app-owned, but event persistence is kernel-owned through `genesis.events.emit()`
  - `F_P` handling is engine-owned through dispatch-runtime policy resolution; `F_H` proxy approval remains a CLI concern
  - runtime contract worker identity is first-class input; the CLI must not silently replace it with a build default
  - absent explicit runtime build identity, the compatibility `build` projection resolves through engine/worker runtime truth rather than a historical `claude_code` fallback
