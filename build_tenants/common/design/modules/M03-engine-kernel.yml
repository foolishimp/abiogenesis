invariants:
  - canonical materialization, convergence, and provenance are functional-core value transformations with explicit interpreter-edge effects only
  - materialization fails closed on undeclared graph-function identity, profile, or structural parameter, and on outer-contract violation
  - recursive zoom/materialize/fold-back preserves outer contract, lineage, and replayable provenance end to end
  - graph-derived evaluator bundles come from refined or realized structure rather than hidden interpreter-local strategy
  - downstream GTL/ABG program conformance is admitted through one ABG-owned static gate over admitted inventory, feature coverage, owner classification, and evidence-bound report identity
  - graph remains primary structural truth even when selected subgraphs or evaluator bundles are derived
  - public start/resume is an ignition boundary only; replay-derived graph-function iteration and next-edge advancement remain kernel-owned beneath it
  - an already-admitted runtime catalog basis is distinct from startup declaration admission; invocation consumes the basis without re-admitting or re-emitting its declarations
  - bound multi-product catalog admission threads one projection across system declarations and one config-scoped batch per product so cross-product conflicts remain visible
  - only GraphFunction-backed graph_function and validated effect-free identity node_type rows enter the runtime GraphFunction registry; opaque overlay assets enter catalog-only replay truth and remain non-callable
  - catalog-only overlay admission emits exact workspace-scoped catalog_asset_admitted or catalog_asset_rejected events included in the canonical RuntimeEvent roster and ordinal projection fold
  - catalog invocation assembles the existing EngineStartRequest after selection; runEngineStartAsync and admitExecutionBasis remain the sole GraphFunction, Job, graph, and ExecutionBasis construction path
  - catalog invocation admits input and standard ABG capability bindings, emits registry selection before GraphCall, and enters the ordinary start-to-iterate runner
  - next-edge selection is derived from event truth over graph-call, frame, vector-local traversal, evaluation, proof, and closure facts rather than package-local loop state or fixed first-vector shortcuts
  - retry/repair mints fresh attempt identity and regenerates prompt/manifest truth from current projection rather than redispatching stale controller state
  - bounded leaf-task execution remains parent-bound runtime work and not a rival top-level workflow ontology
  - workflow version, work key, and run id enter event emission through explicit event-context values rather than mutable hidden stream state
  - neutral build projection resolves through runtime identity as build_id -> worker_id -> engine_id rather than through a hardcoded tool default
  - effect-edge F_P dispatch may contribute explicit WorkSurface fragments, but transport details remain outside the pure traversal/materialization kernels
  - selfhosting drift checks are structural: exported GTL surface, bootloader type table, and evaluator-regime declarations must agree
composes_with:
  - M01-gtl-core supplies the declared graph, algebra, and evaluation surfaces being interpreted
  - M02-work-publication supplies the published module and graph-function truth being materialized
  - M04-app-bootstrap owns public operation admission and app-edge effects above the kernel; it does not own iteration or continuation
  - M05-qualification-scenarios proves replay, refinement, and convergence behavior against scenario harnesses
test_obligations:
  - explicit request/record materialization tests with replayable provenance
  - fail-closed tests for undeclared graph-function ids, profiles, parameters, and outer-contract violations
  - traversal tests for delegated materialization, convergence, selection, and provenance rather than hidden local strategy
  - graph-function iteration tests prove replay-derived progression across composed graph boundaries until a lawful stop condition
  - next-edge selection tests reject first-vector-only dispatch as graph-function execution parity
  - retry/repair tests prove fresh attempt identity, stale-manifest rejection, bounded budget exhaustion, and continuation repair linkage
  - leaf-task tests prove parent-bound schema-validated subordinate work and typed failure boundaries
  - traversal tests for explicit WorkSurface contributions from effect-edge F_P dispatch without hidden runtime mutation
  - event-context tests for explicit workflow/work/run provenance without stream-local mutation
  - refinement tests for parent/child lineage, lawful fold-back, and refined evaluator-bundle derivation
  - provenance tests that preserve graph-function, materialization, bundle, and refined-boundary identity across execution
  - structural selfhosting tests that fail when bootloader sections drift from the exported GTL surface even if names still appear elsewhere in the document
  - GTL program conformance tests reject malformed raw input, partial feature manifests, spoofed feature owners, lossy target-carrier rows, stale active source identities, and proxy observations that infer hooks or F-star composition from unrelated rows
  - catalog tests prove projection-threaded multi-product admission, startup-versus-admitted-basis exclusivity, no duplicate re-admission on invoke, non-GraphFunction refusal, and selection-before-GraphCall ordering
notes:
  - canonical ABG graph-function materialization and graph-derived companion bundle derivation are kernel-owned design obligations for the 1.1 line
  - the internal iteration engine is part of the kernel; M04 public start, resume, and control-loop surfaces may admit or resume work but do not substitute for graph traversal advancement
  - retry/repair is substrate-owned runtime governance; transport helpers and CLI loops may execute effects but do not own retry truth
  - leaf-task execution is subordinate runtime work under the parent boundary; it does not become public semantic work or a top-level ABG workflow
  - kernel materialization and traversal should read as a functional core with explicit interpreter-edge effects; event emission, transport, and subprocess remain outside the pure materialization/convergence kernels
  - recursive refinement is lawful only when parent contract, child materialization, derived evaluator bundle, and fold-back provenance remain replayable end to end
  - the dedicated materialization surface is the canonical kernel seam for explicit graph-function materialization and companion-bundle derivation
