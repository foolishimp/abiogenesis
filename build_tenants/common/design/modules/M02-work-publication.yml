owns:
  - GTL semantic work declarations
  - module publication boundary
  - authored package publication surface
  - graph-function discoverability and materialization-visible publication metadata
  - symbolic and replayable graph-function publication truth
implements_features:
  - REQ-L-GTL3-JOB
  - REQ-L-GTL3-ROLE
  - REQ-L-GTL3-IDENTITY
  - REQ-L-GTL3-MODULE
  - REQ-L-GTL3-GRAPHFUNCTION
  - REQ-L-GTL3-SELECTION-BOUNDARY
primary_surfaces:
  - work-publication.contract-surface
  - work-publication.module-publication-surface
  - work-publication.package-manifest-surface
  - work-publication.package-discoverability-surface
interfaces:
  - ContractRef
  - Role
  - Job
  - ModuleImport
  - Module
  - published module declaration identities
invariants:
  - published graph functions remain inspectable through symbolic references and explicit outer contracts
  - module publication preserves declaration identity across import and reuse
  - publication metadata is visibility surface only and not a hidden strategic control plane
  - semantic work declarations remain distinct from runtime execution wrappers
composes_with:
  - M01-gtl-core provides the declaration types and algebraic surfaces being published
  - M03-engine-kernel consumes published module truth for materialization, binding, and provenance
  - M04-app-bootstrap loads installed module surfaces without rewriting publication truth
test_obligations:
  - module publication tests preserve graph-function, job, and role identity through import
  - publication tests fail closed on undeclared or ambiguous declaration references
  - module surfaces expose enough metadata for replayable materialization without ambient module-state capture
notes:
  - published graph functions must remain inspectable through symbolic references and explicit outer contracts rather than anonymous closures or ambient interpreter state
  - publication metadata is visibility surface only; strategic choice remains in explicit algebraic declarations and external selection
