module: M01-gtl-core
status: active
owns:
  - GTL graph structure and ontology
  - operators, evaluators, rules, and algebraic graph programming
implements_features:
  - REQ-L-GTL3-LANGUAGE
  - REQ-L-GTL3-ATTRS
  - REQ-L-GTL3-CONTEXT
  - REQ-L-GTL3-GRAPH
  - REQ-L-GTL3-NODE
  - REQ-L-GTL3-GRAPHVECTOR
  - REQ-L-GTL3-INTERFACE
  - REQ-L-GTL3-OPERATOR
  - REQ-L-GTL3-EVALUATOR
  - REQ-L-GTL3-RULE
  - REQ-L-GTL3-GRAPHFUNCTION
  - REQ-L-GTL3-HOOKS
  - REQ-L-GTL3-COMPOSE
  - REQ-L-GTL3-SUBSTITUTE
  - REQ-L-GTL3-RECURSE
  - REQ-L-GTL3-HOF
  - REQ-L-GTL3-LAWS
  - REQ-L-GTL3-SUBWORK
  - REQ-L-GTL3-SYNTHESIS
  - REQ-L-GTL3-SELECTION-BOUNDARY
  - REQ-L-GTL3-IDENTITY
primary_surfaces:
  - gtl-core.graph-surface
  - gtl-core.operator-model-surface
  - gtl-core.function-model-surface
  - gtl-core.algebra-surface
interfaces:
  - Node[T]
  - GraphVector
  - Context
  - Graph
  - Regime, F_D, F_P, F_H
  - Operator
  - Evaluator
  - Rule
  - GraphFunction
  - RefinementBoundary
  - CandidateFamily
  - compose(*functions)
  - substitute(outer, contract_vector, inner)
  - recurse(graph_function, termination)
  - fan_out(f, over)
  - fan_in(reducer, over)
  - gate(target, rule, evaluators)
  - promote(source, to)
  - identity(interface)
  - same_object(left, right)
  - RefinementBoundary
  - CandidateFamily
invariants:
  - prime GTL declaration types are immutable value records
  - GraphVector is internal adjacency truth and a transition-governance declaration surface
  - GraphFunction outer contracts remain stable across composition, substitution, and recursion
  - interface satisfaction is structural over node name, schema, and markov conditions rather than name-only matching
  - graph-function publication truth is symbolic and replayable rather than anonymous runtime closure state
  - structured higher-order semantics such as recursion termination, gate obligations, and governance hook attachment remain inspectable on GTL declarations
  - algebraic operators may change realized structure but must preserve declared outer contract where the law requires it
  - RefinementBoundary and CandidateFamily are selection/refinement/publication carriers, not core graph algebra operators
  - GTL core does not depend on ABG runtime types or interpreter state
composes_with:
  - M02-work-publication publishes GTL declarations for import and reuse
  - M03-engine-kernel materializes and interprets GTL declarations without redefining their semantics
test_obligations:
  - structural law tests for immutable value semantics and stable equality behavior
  - composition law tests for interface preservation, structural contract matching, and fail-closed mismatch handling
  - substitution law tests for outer-boundary preservation and refined-structure exposure
  - recursion law tests for bounded recursion, inspectable termination declarations, and lineage-preserving outer-contract stability
  - higher-order operator tests for explicit `over` boundaries, inspectable gate declarations, and no hidden strategy in GTL core
