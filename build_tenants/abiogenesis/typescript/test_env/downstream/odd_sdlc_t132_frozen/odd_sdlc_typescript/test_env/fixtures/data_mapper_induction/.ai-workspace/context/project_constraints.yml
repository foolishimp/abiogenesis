# Project Constraints — data_mapper.test11
# Implements: REQ-CTX-001 (Context as Constraint Surface)
# Generated by gen-setup.py — fill in during requirements→design edge

project:
  name: ""  # set to test run name (e.g. data_mapper.test11)
  kind: "data-pipeline"
  overlay_strategy: full_lifecycle
  overlay_ref: overlay://odd-sdlc/current-full-traversal
  language: "Scala"
  test_runner: "sbt test"

active_tenant: "scala_spark"
selected_output_root: "build_tenants/scala_spark"

# Mandatory dimensions — bound from INTENT.md v7.2 constraints + test09 design phase
constraints:
  ecosystem_compatibility:
    language: "Scala"
    version: "2.13.12"
    runtime: "JVM 11+"
    frameworks:
      - "Apache Spark 3.5.0"
      - "ScalaTest 3.2"
  deployment_target:
    platform: "distributed compute cluster"
    cloud_provider: ""        # unspecified — INTENT.md says "must support distributed frameworks"
    environment_tiers: ["local", "cluster"]
  security_model:
    authentication: "none"    # internal engine — no external auth
    authorisation: "none"
    data_protection: "immutable execution contexts per epoch (INT-002 Axiom 4)"
  build_system:
    tool: "sbt"
    module_structure: "multi-module sbt project (cdme-model, cdme-compiler, cdme-runtime, cdme-spark, cdme-lineage, cdme-context, cdme-ai-assurance, cdme-api)"
    ci_integration: ""

  # Advisory dimensions
  data_governance:
    classification: "internal"
    retention: "per epoch/batch context"
    regulations: ["BCBS 239", "FRTB", "GDPR/CCPA", "EU AI Act Art.14/15"]
  performance_envelope:
    p99_latency_ms: null      # validation at definition time — not latency-bound
    throughput_rps: null
  observability:
    logging: "OpenLineage API (INT-001 constraint)"
    metrics: "ledger.json per run (record accounting)"
    tracing: "OpenLineage facets"
  error_handling:
    strategy: "fail-fast"     # INT-002 Axiom 10: Failures are Data (Error Domain objects)

# Multi-tenant folder structure
structure:
  design_tenants:
    - name: "scala_spark"
      output_dir: "build_tenants/scala_spark/"
      description: "Scala 2.13 + Apache Spark 3.5 implementation"
    - name: "python"
      output_dir: "build_tenants/python/"
      status: "disabled"
      description: "Disabled legacy discovery/comparison evidence only; not an active operator, install, gap, start, or qualification surface."
  root_code_policy: reject

build_tenants:
  scala_spark:
    output_dir: "build_tenants/scala_spark"
    status: "active"
    language: "scala"
    build_tool: "sbt"
    version: "2.13.12"
    test_runner: "sbt test"
    build_execution_contract: "sbt clean assembly"
    test_execution_contract: "sbt test"
    deployment_contract: "spark-submit"
    runtime_observation_contract: "ledger.json"
  python:
    output_dir: "build_tenants/python"
    status: "disabled"
    language: "python"
    description: "Legacy discovery/comparison evidence only."
