# Project Constraints — data_mapper template
# Implements: REQ-CTX-001 (Context as Constraint Surface), REQ-BT-001 (Build Tenant Declaration)
# Instantiated per test run — set active_tenant and project.name before pipeline start

project:
  name: "data_mapper"
  kind: "data-pipeline"
  test_runner: "sbt test"
  test_execution_contract: "sbt test"

# Active build tenants (REQ-BT-001)
# primary: execution tier that must fully converge
# secondary: best-effort tenant generated alongside primary (gaps advisory not blocking)
# Valid values: scala_spark | dbt
active_tenant: "scala_spark"
secondary_tenant: ""        # optional — set to "dbt" to generate DBT surface alongside primary
secondary_tenant_mode: "best_effort"

# ── Build Tenant Registry ────────────────────────────────────────────────────
# Each tenant declares its execution tier, runner, and capability contracts.
# The pipeline uses this to select code generation templates and enforce
# tenant-specific obligations (REQ-BT-002, REQ-BT-003, REQ-BT-004).

build_tenants:

  scala_spark:
    description: "Scala 2.13 + Apache Spark 3.5 — distributed DataFrame execution"
    execution_tier: "spark_dataframe"
    output_dir: "build_tenants/scala_spark/"
    language: "Scala"
    language_version: "2.13.12"
    runtime: "JVM 11+"
    build_tool: "sbt"
    test_runner: "sbt test"
    test_execution_contract: "sbt test"
    module_structure:
      - "cdme-compiler"    # topological compiler, type resolver, grain checker, sheaf manager
      - "cdme-assurance"   # AI assurance and dry-run executor
      - "cdme-executor"    # morphism executor, run manifest, cost estimator
      - "cdme-adjoint"     # adjoint compiler, reconciliation, impact analysis
      - "cdme-accounting"  # accounting verifier, ledger writer, run completion gate
      - "cdme-fidelity"    # covariance contracts, fidelity verification, data quality
      - "cdme-engine"      # top-level facade and CLI runner entry point
    capability_contracts:
      spark_session: true              # SparkSession MUST be constructed at startup (REQ-BT-002.1)
      dataframe_reads: true            # all dataset reads via spark.read (REQ-BT-002.2)
      scala_collection_data_reads: false  # scala.io.Source for dataset reads is PROHIBITED
      cli_runner_class: "cdme.engine.CdmeEngineRunner"  # main object (REQ-BT-002.3)
      fat_jar: true                    # packageable via sbt assembly (REQ-BT-002.4)
      spark_submit_compatible: true    # invocable via spark-submit (REQ-BT-002.4)
    frameworks:
      - "Apache Spark 3.5.0"
      - "ScalaTest 3.2.17"
      - "cats-core 2.10.0"
      - "sbt-assembly (fat JAR)"

  dbt:
    description: "DBT — SQL morphism models with schema tests and ledger emission"
    execution_tier: "dbt_sql"
    output_dir: "build_tenants/dbt/"
    language: "SQL"
    language_version: "SQL:2016"
    build_tool: "dbt"
    test_runner: "dbt test"
    test_execution_contract: "dbt test"
    module_structure:
      - "models/staging"    # source declarations and raw ingestion models
      - "models/morphisms"  # one model per topology morphism
      - "models/error_domain"  # error routing models (REQ-BT-003.6)
      - "models/fidelity"   # hop-level fidelity and certificate models (REQ-BT-003.5)
      - "models/accounting" # accounting invariant singular tests (REQ-BT-003.4)
      - "tests/"            # custom generic tests for type conformance
      - "macros/"           # shared SQL macros for error domain and fidelity logic
    capability_contracts:
      morphism_per_model: true         # one .sql model per morphism_id (REQ-BT-003.1)
      sources_declared: true           # physical bindings as dbt sources (REQ-BT-003.2)
      schema_tests: true               # column-level not_null / accepted_values (REQ-BT-003.3)
      accounting_singular_test: true   # balance invariant as dbt singular test (REQ-BT-003.4)
      error_domain_model: true         # failed records in error_domain model (REQ-BT-003.6)
      cli_runner_script: "run_dbt.sh"  # wrapper that emits ledger.json (REQ-BT-003.7)
      warehouse: ""                    # set per run: duckdb | snowflake | bigquery
    frameworks:
      - "dbt-core 1.7+"
      - "dbt-duckdb (local) | dbt-snowflake | dbt-bigquery (cluster)"

# ── Shared Constraints (apply to all tenants) ────────────────────────────────
constraints:
  deployment_target:
    environment_tiers: ["local", "cluster"]
    cloud_provider: ""  # unspecified — set per run
  security_model:
    authentication: "none"
    authorisation: "none"
    data_protection: "immutable execution contexts per epoch (INT-002 Axiom 4)"
  data_governance:
    classification: "internal"
    retention: "per epoch/batch context"
    regulations: ["BCBS 239", "FRTB", "GDPR/CCPA", "EU AI Act Art.14/15"]
  performance_envelope:
    p99_latency_ms: null
    throughput_rps: null
  observability:
    logging: "OpenLineage API (INT-001 constraint)"
    metrics: "ledger.json per run (REQ-ENG-004)"
    tracing: "OpenLineage facets"
  error_handling:
    strategy: "fail-fast"  # INT-002 Axiom 10: Failures are Data

# ── Pipeline Governance ───────────────────────────────────────────────────────
ambiguity_risk_appetite: "low"
root_code_policy: reject
